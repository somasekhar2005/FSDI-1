<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Details</h1>

    <table border="1">
        
        <!-- Table Header -->
        <tr>
            <td colspan="4"><b>Student Information</b></td>
        </tr>

        <!-- Column Names -->
        <tr>
            <td><b>Roll No</b></td>
            <td><b>Name</b></td>
            <td><b>Branch</b></td>
            <td><b>Year</b></td>
        </tr>

        <!-- Student 1 -->
        <tr>
            <td>101</td>
            <td>Ravi</td>
            <td>CSE</td>
            <td rowspan="2">2nd Year</td>
        </tr>

        <!-- Student 2 -->
        <tr>
            <td>102</td>
            <td>Rani</td>
            <td>IT</td>
        </tr>

        <!-- Student 3 -->
        <tr>
            <td>103</td>
            <td>Rahul</td>
            <td>ECE</td>
            <td>3rd Year</td>
        </tr>

        <!-- Footer -->
        <tr>
            <td colspan="4"><b>End of Student Details</b></td>
        </tr>

    </table>

</body>
</html>
