<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>
<body>

    <h1>Working of Hyperlinks in HTML</h1>

    <h2>1. Basic Hyperlink</h2>
    <a href="https://www.google.com">
        Visit Google
    </a>

    <br><br>

    <h2>2. Open Link in New Tab</h2>
    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>

    <br><br>

    <h2>3. Open Link in Same Tab</h2>
    <a href="https://www.wikipedia.org" target="_self">
        Visit Wikipedia
    </a>

</body>
</html>
